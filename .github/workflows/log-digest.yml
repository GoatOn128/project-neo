name: Build log digest

# Takes the build logs from the root of the repository, build.log and
# build-linux.log, and turns each into a short report: error count, warning
# count, the warnings that repeat the most and the first errors with their
# file and line. The reports go into the job summary, are saved as artifacts
# and are committed to the repository as build-digest.md and
# build-linux-digest.md, so they can be read without downloading the
# artifacts.
#
# This runs when the Build workflow finishes, not when build.log is pushed:
# the Build workflow commits build.log with GITHUB_TOKEN and pushes made with
# that token do not trigger other workflows. A finished run does.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    name: Digest the build logs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check that build.log exists
        id: check
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No build.log in the root of the repository. Put one there and run this again."
          fi
          if [ -f build-linux.log ]; then
            echo "found_linux=true" >> "$GITHUB_OUTPUT"
          else
            echo "found_linux=false" >> "$GITHUB_OUTPUT"
            echo "No build-linux.log in the root of the repository."
          fi

      - name: Parse build.log
        if: steps.check.outputs.found == 'true'
        shell: bash
        run: |
          cat > parse_build_log.py << 'EOF'
          import re
          import sys
          from collections import Counter

          log_path = sys.argv[1] if len(sys.argv) > 1 else 'build.log'
          with open(log_path, 'r', errors='replace') as f:
              lines = f.read().splitlines()

          # Matches errors from clang, gcc, MSVC, the linker and scons.
          error_re = re.compile(
              r'(\berror\b\s*:|fatal error|error C\d{4}|undefined reference|'
              r'LNK\d{4}|scons: \*\*\*)',
              re.IGNORECASE)
          warning_re = re.compile(r'\bwarning\b\s*:|warning C\d{4}', re.IGNORECASE)

          # GCC reports errors inside system headers with the engine file that pulled
          # the header in on an "In file included from" line right before the error.
          # Remember that file and note it next to messages in system headers.
          origin = None
          origin_re = re.compile(r'(?:In file included from|from)\s+(code/[\w/.]+):\d+')
          loc_re = re.compile(r'^([^:]+):\d+')

          def annotate(entry):
              lm = loc_re.match(entry)
              if lm and not lm.group(1).startswith('code/') and origin:
                  return entry + '   [in ' + origin + ']'
              return entry

          errors = []
          warnings = []
          for line in lines:
              m = origin_re.search(line)
              if m:
                  origin = m.group(1)
              if error_re.search(line):
                  errors.append(annotate(line.strip()))
              elif warning_re.search(line):
                  warnings.append(annotate(line.strip()))

          def group(messages):
              # The same message with the numbers swapped out counts as one. Quoted
              # tokens are kept so different identifiers stay different errors.
              grouped = Counter()
              for message in messages:
                  grouped[re.sub(r'\d+', 'N', message)] += 1
              return grouped

          warn_groups = group(warnings)

          def count_by_file(messages):
              # Every file that shows up in the log, with its message count, so files
              # with only a few messages are not hidden by a top-30 cutoff.
              counts = Counter()
              for message in messages:
                  lm = loc_re.match(message)
                  if lm:
                      counts[lm.group(1)] += 1
                  elif '[in ' in message:
                      counts[message.split('[in ', 1)[1].rstrip(']')] += 1
              return counts

          err_files = count_by_file(errors)
          warn_files = count_by_file(warnings)

          out = []
          out.append('# Build log digest')
          out.append('')
          out.append('- Log: `%s`' % log_path)
          out.append('- Lines: %d' % len(lines))
          out.append('- Errors: %d' % len(errors))
          out.append('- Warnings: %d' % len(warnings))
          out.append('')
          if len(errors) == 0:
              out.append('**Verdict: no errors found in the log.**')
          else:
              out.append('**Verdict: the build failed, the errors are below.**')
              out.append('')
              out.append('## Errors, first 40')
              out.append('')
              out.append('```')
              out.extend(errors[:40])
              out.append('```')
              err_groups = group(errors)
              if len(err_groups) > 1:
                  out.append('')
                  out.append('## Errors that repeat, top 30')
                  out.append('')
                  out.append('| Count | Error |')
                  out.append('| --- | --- |')
                  for err, count in err_groups.most_common(30):
                      out.append('| %d | %s |' % (count, err.replace('|', '\\|')))
          if err_files:
              out.append('')
              out.append('## Errors by file')
              out.append('')
              out.append('| Count | File |')
              out.append('| --- | --- |')
              for file, count in err_files.most_common():
                  out.append('| %d | %s |' % (count, file.replace('|', '\\|')))

          if warn_groups:
              out.append('')
              out.append('## Warnings that repeat, top 30')
              out.append('')
              out.append('| Count | Warning |')
              out.append('| --- | --- |')
              for warning, count in warn_groups.most_common(30):
                  out.append('| %d | %s |' % (count, warning.replace('|', '\\|')))
          if warn_files:
              out.append('')
              out.append('## Warnings by file')
              out.append('')
              out.append('| Count | File |')
              out.append('| --- | --- |')
              for file, count in warn_files.most_common():
                  out.append('| %d | %s |' % (count, file.replace('|', '\\|')))

          out.append('')
          print('\n'.join(out))
          EOF
          python3 parse_build_log.py build.log > build-digest.md
          cat build-digest.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-linux.log ]; then
            python3 parse_build_log.py build-linux.log > build-linux-digest.md
            cat build-linux-digest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the digest
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-digest
          path: |
            build-digest.md
            build-linux-digest.md
          if-no-files-found: ignore

      - name: Put the digest in the repository
        if: steps.check.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for digest in build-digest.md build-linux-digest.md; do
            if [ -f "$digest" ]; then
              git add "$digest"
            fi
          done
          if git diff --cached --quiet; then
            echo "The digest did not change."
          else
            git commit -m "Update the build log digest"
            git pull --rebase
            git push
          fi
