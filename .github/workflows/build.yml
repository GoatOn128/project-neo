name: Build

# Compiles the project and saves the build logs as artifacts for every
# platform. Windows x86 and Windows x64 compile first, then Linux x64.
# Each job commits its logs, and the later jobs run after the earlier ones
# so the log commits never push at the same time.

on:
  push:
    branches: [main]
    # Changing only the logs does not need a new build.
    paths-ignore:
      - 'build.log'
      - 'build-x64.log'
      - 'build-linux.log'
      - 'test.log'
      - 'test-x64.log'
      - 'test-linux.log'
      - 'sdl3-build.log'
      - 'build-digest.md'
      - 'build-linux-digest.md'
  pull_request:
  workflow_dispatch:

# Two pushes a few seconds apart used to start two Build runs at the same
# time, and both runs then tried to commit the same log files. Retrying
# the push cannot fix that conflict, so the newer run cancels the older
# one and only one run commits logs at a time.
concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        arch: [x86]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up MSVC (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Make sure clang-cl exists (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          clang-cl --version

      - name: Build (Windows x86)
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: bash
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons -j "$JOBS" 2>&1 | tee build.log

      - name: Run the tests (Windows x86)
        # Building the tests stays optional for a local build, but the CI
        # run always builds and runs them.
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: bash
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons test -j "$JOBS" 2>&1 | tee test.log

      - name: Report the build errors
        # The full logs are only in the artifact, so the errors are
        # copied into the job summary where they can be read on the run
        # page without downloading anything.
        if: failure() && runner.os == 'Windows' && matrix.arch == 'x86'
        shell: bash
        run: |
          {
            echo '### Build errors'
            echo ''
            echo '```'
            grep -i -E 'error|scons: \*\*\*' build.log | head -40 || true
            echo '```'
            echo '### Test errors'
            echo ''
            echo '```'
            grep -i -E 'error|scons: \*\*\*' test.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the build log
        # The build log is committed to the repository root, the same
        # place a manual build keeps it, whether the build passed or
        # failed. The digest workflow then runs when this Build run
        # finishes, writes build-digest.md and lets the log be read
        # without downloading the artifact.
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.arch == 'x86' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A failed build never writes test.log, so only the logs
          # that exist are added. Without this the step fails and the
          # build log never reaches the repository.
          for log in build.log test.log; do
            if [ -f "$log" ]; then
              git add "$log"
            fi
          done
          if git diff --cached --quiet; then
            echo "build.log did not change."
          else
            git commit -m "Save the Windows x86 build and test logs"
            # Another run can push its logs while this job builds. The rebase
            # takes this job's own log on a conflict and retries the push.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X theirs && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            # The build result above is what matters, so a failed log
            # push only warns instead of failing the job and skipping
            # every later job.
            echo "::warning::Could not push the logs after several attempts. The build result stands, but the log is not in the repository."
            exit 0
          fi

      - name: Save build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore

      - name: Save test.log
        if: always() && runner.os == 'Windows' && matrix.arch == 'x86'
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.arch }}
          path: test.log
          if-no-files-found: ignore

  build-x64:
    name: windows-latest x64
    # Runs after the matrix job so the log commit below never pushes at
    # the same time as the Windows x86 log commit.
    needs: build
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up MSVC (Windows x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Make sure clang-cl exists (Windows x64)
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }
          clang-cl --version

      - name: Build (Windows x64)
        shell: bash
        # -k keeps compiling after an error, so one run reports every
        # broken file while the x64 port is being finished.
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons -k arch=x64 -j "$JOBS" 2>&1 | tee build-x64.log

      - name: Run the tests (Windows x64)
        shell: bash
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons test arch=x64 -j "$JOBS" 2>&1 | tee test-x64.log

      - name: Report the build errors
        # The full logs are only in the artifact, so the errors are
        # copied into the job summary where they can be read on the run
        # page without downloading anything.
        if: failure()
        shell: bash
        run: |
          {
            echo '### Build errors (x64)'
            echo ''
            echo '```'
            grep -i -E 'error|scons: \*\*\*' build-x64.log | head -40 || true
            echo '```'
            echo '### Test errors (x64)'
            echo ''
            echo '```'
            grep -i -E 'error|scons: \*\*\*' test-x64.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the build log
        # Same as the x86 job: the logs are committed to the repository
        # root so they can be read without downloading the artifact.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A failed build never writes test-x64.log, so only the logs
          # that exist are added. Without this the step fails and the
          # build log never reaches the repository.
          for log in build-x64.log test-x64.log; do
            if [ -f "$log" ]; then
              git add "$log"
            fi
          done
          if git diff --cached --quiet; then
            echo "build-x64.log did not change."
          else
            git commit -m "Save the Windows x64 build and test logs"
            # Another run can push its logs while this job builds. The rebase
            # takes this job's own log on a conflict and retries the push.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X theirs && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            # The build result above is what matters, so a failed log
            # push only warns instead of failing the job and skipping
            # every later job.
            echo "::warning::Could not push the logs after several attempts. The build result stands, but the log is not in the repository."
            exit 0
          fi

      - name: Save build-x64.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows-latest-x64
          path: build-x64.log
          if-no-files-found: ignore

      - name: Save test-x64.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows-latest-x64
          path: test-x64.log
          if-no-files-found: ignore

  build-linux:
    name: ubuntu-latest x64
    # Runs after the other log commits so this one never pushes at the
    # same time as they do.
    needs: build-x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libopenal-dev libfluidsynth3 \
            libgl1-mesa-dev libglx-dev libglvnd-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxtst-dev libxkbcommon-dev \
            libxss-dev \
            libwayland-dev libwayland-egl-backend-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - name: Build and install the pinned SDL3
        # The output goes to sdl3-build.log so a failure in this step can
        # be read from the repository like the scons logs instead of only
        # from the job page that needs a login.
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL --retry 3 -o SDL3-3.4.18.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
          tar xf SDL3-3.4.18.tar.gz
          cmake -S SDL3-3.4.18 -B sdl3-build -DCMAKE_BUILD_TYPE=Release \
            -DSDL_AUDIO=OFF -DSDL_RENDER=OFF -DSDL_VULKAN=OFF -DSDL_TESTS=OFF 2>&1 | tee sdl3-build.log
          cmake --build sdl3-build -j"$(nproc)" 2>&1 | tee -a sdl3-build.log
          sudo cmake --install sdl3-build 2>&1 | tee -a sdl3-build.log
          sudo ldconfig

      - name: Build (Linux x64)
        shell: bash
        # -k keeps compiling after an error, so one run reports every
        # broken file while the Linux port is being finished.
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons -k editor=no -j "$JOBS" 2>&1 | tee build-linux.log

      - name: Run the tests (Linux x64)
        shell: bash
        run: |
          set -o pipefail
          JOBS=$(nproc 2>/dev/null || echo 2)
          scons test editor=no -j "$JOBS" 2>&1 | tee test-linux.log

      - name: Report the build errors
        if: failure()
        shell: bash
        run: |
          {
            echo '### Build errors (Linux)'
            echo ''
            echo '```'
            grep -i -E 'error|scons: \*\*\*' build-linux.log | head -40 || true
            echo '```'
            echo '### SDL3 build errors (Linux)'
            echo ''
            echo '```'
            grep -i -E 'error|scons: \*\*\*|fatal' sdl3-build.log | head -40 || true
            echo '```'
            echo '### Test errors (Linux)'
            echo ''
            echo '```'
            grep -i -E 'error|scons: \*\*\*' test-linux.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the build log
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A failed build never writes test-linux.log, so only the logs
          # that exist are added. Without this the step fails and the
          # build log never reaches the repository.
          for log in build-linux.log test-linux.log sdl3-build.log; do
            if [ -f "$log" ]; then
              git add "$log"
            fi
          done
          if git diff --cached --quiet; then
            echo "build-linux.log did not change."
          else
            git commit -m "Save the Linux x64 build and test logs"
            # Another run can push its logs while this job builds. The rebase
            # takes this job's own log on a conflict and retries the push.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X theirs && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            # The build result above is what matters, so a failed log
            # push only warns instead of failing the job and skipping
            # every later job.
            echo "::warning::Could not push the logs after several attempts. The build result stands, but the log is not in the repository."
            exit 0
          fi

      - name: Save build-linux.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ubuntu-latest-x64
          path: build-linux.log
          if-no-files-found: ignore

      - name: Save test-linux.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-ubuntu-latest-x64
          path: test-linux.log
          if-no-files-found: ignore
